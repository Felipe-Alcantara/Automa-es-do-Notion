[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "felixo-notion-mcp"
version = "0.6.0.dev0"
description = "Automações do Notion em um único pacote: biblioteca, CLI, servidor MCP e app."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Felipe Alcantara" }]
keywords = ["notion", "notion-api", "cli", "mcp", "ai", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "python-docx>=1.1",
    "requests>=2.25",
    "mcp>=1.28,<2",
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
app = [
    "Django>=5.0",
    "questionary>=2.0",
    "rich>=13.0",
]
planilha = [
    "openpyxl>=3.1",
]
native = [
    "pyinstaller>=6,<7",
]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
    "ruff>=0.4",
    "openpyxl>=3.1",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/Felipe-Alcantara/Felixo-Notion-MCP"
Repository = "https://github.com/Felipe-Alcantara/Felixo-Notion-MCP"

[tool.hatch.build.targets.wheel]
packages = ["src/felixo_notion_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A raiz entra no pythonpath para que `scripts.*` seja importável nos testes.
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["_importado", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
