name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run python -m pytest -q
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
  pacote:
    needs: front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install uv==0.12.13
      - run: cd front && npm ci && npm run build
      - run: uv build
      - run: python -m scripts.empacotamento.conferir_wheel dist/*.whl
      - run: uv export --frozen --all-extras --no-emit-project --no-hashes -o requisitos-auditoria.txt
      - run: uvx pip-audit -r requisitos-auditoria.txt
